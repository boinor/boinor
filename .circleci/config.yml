version: 2.1

jobs:
  quality: &test-template
    description: Code style
    docker:
      - image: python:3.10
    environment:
      PIP_PREFER_BINARY: true
      PIP_PROGRESS_BAR: "off"
      TOXENV: style
    steps:
      - checkout
      - run: python -m pip install tox
      - run: tox

  tests313:
    <<: *test-template
    description: Tests - Python 3.13
    docker:
      - image: python:3.13
    environment:
      TOXENV: tests313

  tests313-fast:
    <<: *test-template
    description: Tests fast - Python 3.13
    docker:
      - image: python:3.13
    environment:
      TOXENV: tests313-fast

  tests313-coverage:
    <<: *test-template
    description: Tests coverage - Python 3.13
    docker:
      - image: python:3.13
    environment:
      TOXENV: tests313-coverage
    steps:
      - checkout
      - run: python -m pip install tox
      - run: tox
      - run: python -m pip install codecov && codecov

workflows:
  version: 2
  build_and_test:
    jobs:
      - quality
      - tests313:
          requires:
            - quality
      - tests313-fast:
          requires:
            - quality
      - tests313-coverage:
          requires:
            - quality
